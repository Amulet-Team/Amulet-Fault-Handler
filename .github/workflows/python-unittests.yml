# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unittests

on:
  push:
    branches:
      - master
      - main
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

jobs:
  unittests:
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: windows-2025-vs2026, python-version: '3.11', architecture: x64 }
          - { os: windows-2025-vs2026, python-version: '3.12', architecture: x64 }
          - { os: windows-11-vs2026-arm, python-version: '3.11', architecture: arm64 }
          - { os: windows-11-vs2026-arm, python-version: '3.12', architecture: arm64 }
          - { os: macos-15-intel, python-version: '3.11', architecture: x64 }
          - { os: macos-15-intel, python-version: '3.12', architecture: x64 }
          - { os: macos-15, python-version: '3.11', architecture: arm64 }
          - { os: macos-15, python-version: '3.12', architecture: arm64 }
          - { os: ubuntu-24.04, python-version: '3.11', architecture: x64 }
          - { os: ubuntu-24.04, python-version: '3.12', architecture: x64 }

    runs-on: ${{ matrix.cfg.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.cfg.python-version }}
        architecture: ${{ matrix.cfg.architecture }}

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2

    - name: Build
      run: |
        pip install -v .[dev]
        python tools/compile_tests.py

    - name: Register Exception Module (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $moduleDir = python -c "import amulet_faulthandler; print(amulet_faulthandler.__path__[0])"
        $dllPath = Join-Path $moduleDir "amulet_wer.dll"
        $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\RuntimeExceptionHelperModules"
        New-ItemProperty -Path $key -Name $dllPath -Value 0 -PropertyType DWord -Force

    - name: Test with unittest
      run: python -m unittest discover -v -s tests
